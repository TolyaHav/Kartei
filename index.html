<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomen-Verb-Kartei</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9E1C8; --paper-2:#DED3AE; --card:#F2ECD6;
    --ink:#1B2430; --ink-soft:#4A5262; --line:#8B8362;
    --red:#A32638; --gold:#A9791F; --green:#3F6B4A;
    --font-serif:'PT Serif', Georgia, serif;
    --font-mono:'Courier Prime','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);background-image:radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);background-size:3px 3px;color:var(--ink);font-family:var(--font-serif);min-height:100vh;display:flex;justify-content:center;padding:18px 12px 60px;}
  .app{width:100%;max-width:460px;}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .stamp{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px dashed var(--red);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--red);font-family:var(--font-mono);font-weight:700;font-size:13px;opacity:0.85;mix-blend-mode:multiply;}
  .head h1{font-size:20px;margin:0;letter-spacing:0.5px;font-weight:700;}
  .head p{margin:2px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
  .stats{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 2px;margin-bottom:10px;font-family:var(--font-mono);font-size:12px;}
  .stat{flex:1;text-align:center;border-left:1px solid var(--line);}
  .stat:first-child{border-left:none;}
  .stat b{display:block;font-size:15px;}
  .stat span{color:var(--ink-soft);font-size:10px;}
  .stage-row{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);margin:0 0 14px;padding:0 2px;flex-wrap:wrap;gap:4px;}
  .stage-row b{color:var(--ink);}

  .mode-row{display:flex;gap:8px;margin-bottom:14px;}
  .mode-btn{flex:1;font-family:var(--font-mono);font-size:11.5px;padding:9px 4px;background:var(--paper);border:1px solid var(--ink);color:var(--ink-soft);cursor:pointer;text-align:center;}
  .mode-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .card{position:relative;background:var(--card);border:1px solid var(--ink);padding:26px 20px 20px 34px;margin-bottom:16px;box-shadow:4px 4px 0 rgba(27,36,48,0.08);}
  .card::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);pointer-events:none;}
  .holes{position:absolute;left:12px;top:22px;bottom:22px;width:8px;display:flex;flex-direction:column;justify-content:space-between;}
  .holes div{width:8px;height:8px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,0.35);}
  .card-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:10px;}
  .prompt-noun{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);letter-spacing:0.5px;margin-bottom:4px;}
  .sentence{font-size:19px;line-height:1.5;margin-bottom:20px;}
  .sentence.big-noun{font-size:26px;font-weight:700;}
  .blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--ink-soft);text-align:center;padding:0 2px;}
  .blank.filled{border-bottom-style:solid;font-weight:700;}
  .blank.correct{color:var(--green);border-color:var(--green);}
  .blank.wrong{color:var(--red);border-color:var(--red);}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .answer-input{grid-column:1/-1;font-family:var(--font-mono);font-size:16px;padding:12px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);}
  .answer-input.correct{border-color:var(--green);color:var(--green);}
  .answer-input.wrong{border-color:var(--red);color:var(--red);}
  .check-btn{grid-column:1/-1;background:var(--ink);color:var(--paper);}
  .check-btn:hover{background:var(--ink-soft);}
  .opt{font-family:var(--font-mono);font-size:14px;background:var(--paper);border:1px solid var(--ink);padding:10px 6px;cursor:pointer;text-align:center;color:var(--ink);}
  .opt:hover{background:var(--paper-2);}
  .opt:disabled{cursor:default;}
  .opt.right{background:var(--green);border-color:var(--green);color:var(--card);}
  .opt.chosen-wrong{background:var(--red);border-color:var(--red);color:var(--card);}
  .opt.dim{opacity:0.45;}
  .feedback{font-family:var(--font-mono);font-size:12.5px;line-height:1.6;color:var(--ink-soft);min-height:18px;margin-bottom:14px;}
  .feedback b{color:var(--ink);}
  .next-btn{display:block;width:100%;font-family:var(--font-mono);font-size:13px;letter-spacing:0.5px;padding:12px;background:var(--ink);color:var(--paper);border:none;cursor:pointer;}
  .next-btn:disabled{opacity:0.3;cursor:default;}
  .next-btn:not(:disabled):hover{background:var(--ink-soft);}
  .empty-msg{font-family:var(--font-mono);font-size:12.5px;color:var(--red);text-align:center;padding:20px 0;}

  details{border-top:1px solid var(--line);padding-top:10px;font-family:var(--font-mono);}
  summary{cursor:pointer;font-size:12.5px;letter-spacing:0.3px;color:var(--ink-soft);margin-bottom:8px;}
  .panel-controls{display:flex;gap:6px;margin-bottom:8px;}
  .panel-controls input[type=text]{flex:1;font-family:var(--font-mono);font-size:12px;padding:6px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);}
  .panel-controls button{font-family:var(--font-mono);font-size:10.5px;padding:6px 8px;border:1px solid var(--ink);background:var(--paper);cursor:pointer;color:var(--ink-soft);}
  .dossier-list{max-height:320px;overflow-y:auto;font-size:12px;}
  .dossier-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--paper-2);}
  .dossier-item input{flex:0 0 auto;}
  .dossier-item .txt{flex:1;line-height:1.3;}
  .dossier-item .txt small{display:block;color:var(--ink-soft);font-size:10px;}
  .badge{flex:0 0 auto;font-size:9px;padding:2px 5px;border:1px solid currentColor;white-space:nowrap;}
  .b0{color:var(--ink-soft);} .b1{color:var(--ink);} .b2{color:var(--gold);} .b3{color:var(--red);}
  .xmark{color:var(--red);font-weight:700;margin-right:2px;}
  .reset{display:block;text-align:center;margin-top:18px;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="stamp">N + V</div>
    <div><h1>Nomen-Verb-Kartei</h1><p>Funktionsverbgefüge üben</p></div>
  </div>

  <div class="stats">
    <div class="stat"><b id="statXp">0</b><span>XP</span></div>
    <div class="stat"><b id="statStreak">0</b><span>Serie (Tage)</span></div>
    <div class="stat"><b id="statTotal">0</b><span>Aktiv</span></div>
  </div>
  <div class="stage-row">
    <span>Neu <b id="cNeu">0</b></span>
    <span>Gelernt <b id="cLearned">0</b></span>
    <span>Gemeistert <b id="cMastered">0</b></span>
    <span>Unsterblich <b id="cImmortal">0</b></span>
  </div>

  <div class="mode-row">
    <button class="mode-btn" id="modeAll">Alle Wörter</button>
    <button class="mode-btn" id="modeMarked">Nur ✗ markierte</button>
  </div>

  <div class="card">
    <div class="holes"><div></div><div></div><div></div></div>
    <div class="card-label" id="cardLabel">KARTE —</div>
    <div id="cardBody">
      <div class="sentence" id="sentence"></div>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" disabled>Nächste Karte →</button>
  </div>

  <details open>
    <summary>▸ Kartei verwalten — auswählen, was du üben willst</summary>
    <div class="panel-controls">
      <input type="text" id="searchBox" placeholder="Nomen suchen…">
      <button id="selAll">Alle</button>
      <button id="selNone">Keine</button>
    </div>
    <div class="panel-controls">
      <button id="deselMarked">✗ Markierte abwählen</button>
      <button id="selMarked">✗ Markierte auswählen</button>
    </div>
    <div class="dossier-list" id="dossier"></div>
  </details>

  <button class="reset" id="resetBtn">Fortschritt zurücksetzen</button>
</div>

const ITEMS = [...PREMIUM, ...EXTRA];

/* Only common, versatile Funktionsverben are used as wrong-answer options,
   so distractors are always grammatically plausible — never an obvious
   "that verb clearly doesn't fit" giveaway like rufen/laufen/spannen. */
const CORE_VERBS = ["nehmen","machen","geben","stellen","bringen","treffen","ziehen",
  "kommen","stehen","setzen","halten","leisten","finden","haben","erheben","treten",
  "geraten","versetzen","schenken","üben","führen","erteilen","gelangen","fassen",
  "schließen","vornehmen","ergreifen","befinden","sein","durchführen","anstellen",
  "unternehmen","ausüben"];

const OPTION_COUNT = 6;

/* Detect the governing preposition of each phrase (in, an, auf, zu/zur/zum, unter,
   außer, bei, vor, nach, mit, für, gegen, über, um, von, durch) so distractors can
   be biased toward verbs that genuinely also combine with that same preposition
   elsewhere in the list — real confusables instead of arbitrary picks. */
const PREP_NORM = {"im":"in","zur":"zu","zum":"zu"};
function detectPrep(ph){
  const tokens = ph.replace(/[().]/g,' ').split(/\s+/);
  const known = ["im","in","an","auf","zu","zur","zum","unter","außer","bei","vor","nach","mit","für","gegen","über","um","von","durch"];
  for(const t of tokens){
    const low=t.toLowerCase();
    if(known.includes(low)) return PREP_NORM[low]||low;
  }
  return null;
}
ITEMS.forEach(it=>{ it.prep = detectPrep(it.p||it.ph||""); });

const PREP_VERB_MAP = {};
ITEMS.forEach(it=>{
  if(!it.prep) return;
  if(!PREP_VERB_MAP[it.prep]) PREP_VERB_MAP[it.prep]=new Set();
  if(CORE_VERBS.includes(it.i)) PREP_VERB_MAP[it.prep].add(it.i);
  if(it.i2 && CORE_VERBS.includes(it.i2)) PREP_VERB_MAP[it.prep].add(it.i2);
});

function pickRandom(count,picked,copy){
  while(picked.length<count && copy.length){
    const idx=Math.floor(Math.random()*copy.length);
    picked.push(copy.splice(idx,1)[0]);
  }
  return picked;
}

/* item can be omitted for a plain random sample (backward compatible). */
function sampleDistractors(correct,count,item){
  const excl = Array.isArray(correct) ? correct : [correct];
  const picked=[];
  if(item && item.prep && PREP_VERB_MAP[item.prep]){
    const nearMiss = [...PREP_VERB_MAP[item.prep]].filter(v=>!excl.includes(v));
    pickRandom(count,picked,[...nearMiss]);
  }
  if(picked.length<count){
    const rest = CORE_VERBS.filter(v=>!excl.includes(v) && !picked.includes(v));
    pickRandom(count,picked,[...rest]);
  }
  return picked;
}

const STORAGE_KEY="nvv-progress";
let state=null, current=null, answered=false;

function todayStr(){return new Date().toISOString().slice(0,10);}

function defaultState(){
  const items={};
  ITEMS.forEach(it=>items[it.id]={stage:0});
  return {version:4,xp:0,dailyCount:0,dailyDate:todayStr(),streak:0,lastDate:null,items,disabled:{},filterMode:"all"};
}

const hasClaudeStorage = (typeof window!=="undefined" && !!window.storage);

async function loadState(){
  try{
    let raw=null;
    if(hasClaudeStorage){
      const res=await window.storage.get(STORAGE_KEY,false);
      if(res && res.value) raw=res.value;
    } else {
      raw = localStorage.getItem(STORAGE_KEY);
    }
    if(raw){
      const parsed=JSON.parse(raw);
      if(!parsed.disabled) parsed.disabled={};
      if(!parsed.filterMode) parsed.filterMode="all";
      ITEMS.forEach(it=>{ if(!parsed.items[it.id]) parsed.items[it.id]={stage:0}; });
      return parsed;
    }
  }catch(e){}
  return defaultState();
}
async function saveState(){
  try{
    const json=JSON.stringify(state);
    if(hasClaudeStorage){ await window.storage.set(STORAGE_KEY, json, false); }
    else { localStorage.setItem(STORAGE_KEY, json); }
  }
  catch(e){ console.error("Speichern fehlgeschlagen", e); }
}
function isEnabled(id){ return !state.disabled[id]; }
function passesFilter(it){ return state.filterMode==="marked" ? !!it.x : true; }
function enabledItems(){ return ITEMS.filter(it=>isEnabled(it.id) && passesFilter(it)); }

function updateStreak(){
  const today=todayStr();
  if(state.lastDate===today) return;
  if(state.lastDate){
    const diff=(new Date(today)-new Date(state.lastDate))/86400000;
    state.streak = diff===1 ? state.streak+1 : 1;
  } else { state.streak=1; }
  state.lastDate=today;
  if(state.dailyDate!==today){ state.dailyDate=today; state.dailyCount=0; }
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickNext(){
  let pool=enabledItems();
  if(pool.length===0) return null;
  if(current && pool.length>1) pool=pool.filter(it=>it.id!==current.id);
  const weights=pool.map(it=>{
    const stage=state.items[it.id].stage;
    return Math.max(4-stage,0.1);
  });
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0) return pool[i]; }
  return pool[0];
}
function renderModeButtons(){
  document.getElementById("modeAll").classList.toggle("active", state.filterMode==="all");
  document.getElementById("modeMarked").classList.toggle("active", state.filterMode==="marked");
}
function renderStats(){
  document.getElementById("statXp").textContent=state.xp;
  document.getElementById("statStreak").textContent=state.streak;
  const pool=enabledItems();
  document.getElementById("statTotal").textContent=pool.length;
  let n=0,l=0,m=0,im=0;
  pool.forEach(it=>{
    const st=state.items[it.id].stage;
    if(st===0)n++; else if(st===1)l++; else if(st===2)m++; else im++;
  });
  document.getElementById("cNeu").textContent=n;
  document.getElementById("cLearned").textContent=l;
  document.getElementById("cMastered").textContent=m;
  document.getElementById("cImmortal").textContent=im;
}
function renderDossier(filter){
  const box=document.getElementById("dossier");
  box.innerHTML="";
  const f=(filter||"").toLowerCase();
  ITEMS.forEach(it=>{
    if(f && !it.n.toLowerCase().includes(f) && !(it.ph||it.p||"").toLowerCase().includes(f)) return;
    const st=state.items[it.id].stage;
    const labels=["NEU","GELERNT","GEMEISTERT","UNSTERBLICH"];
    const row=document.createElement("div");
    row.className="dossier-item";
    const checked=isEnabled(it.id)?"checked":"";
    const xflag = it.x ? '<span class="xmark">✗</span>' : '';
    row.innerHTML=`<input type="checkbox" data-id="${it.id}" ${checked}>
      <span class="txt">${xflag}${it.n}<small>${(it.ph||it.p||"")}</small></span>
      <span class="badge b${st}">${labels[st]}</span>`;
    box.appendChild(row);
  });
  box.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    cb.onchange=async ()=>{
      const id=cb.getAttribute("data-id");
      if(cb.checked) delete state.disabled[id]; else state.disabled[id]=true;
      renderStats();
      await saveState();
    };
  });
}

function renderCard(){
  answered=false;
  current=pickNext();
  const nextBtn=document.getElementById("nextBtn");
  nextBtn.disabled=true;
  const optionsBox=document.getElementById("options");
  optionsBox.innerHTML="";
  document.getElementById("feedback").innerHTML="";

  if(!current){
    document.getElementById("cardLabel").textContent="KEINE KARTEN AKTIV";
    document.getElementById("cardBody").innerHTML='<div class="empty-msg">Wähle unten in der Kartei mindestens eine Karte aus.</div>';
    return;
  }
  const pool=enabledItems();
  const idx=pool.indexOf(current)+1;
  const stage=state.items[current.id].stage;
  const textMode = stage>=2;
  document.getElementById("cardLabel").textContent=`KARTE ${idx}/${pool.length}${textMode?" · TIPPEN":""}`;

  const phraseSrc = current.p || current.ph || current.n;
  const blankHTML = '<span class="blank" id="blankSpan">___</span>';
  let blanked;
  if(current.i2){
    const combo1 = current.i+' / '+current.i2;
    const combo2 = current.i2+' / '+current.i;
    if(phraseSrc.includes(combo1)) blanked = phraseSrc.replace(combo1, blankHTML);
    else if(phraseSrc.includes(combo2)) blanked = phraseSrc.replace(combo2, blankHTML);
    else blanked = phraseSrc.replace(current.i, blankHTML);
  } else {
    blanked = phraseSrc.replace(current.i, blankHTML);
  }
  document.getElementById("cardBody").innerHTML=
    `<div class="prompt-noun">${current.n}</div><div class="sentence" id="sentenceEl">${blanked}</div>`;
  const correctSet = current.i2 ? [current.i, current.i2] : [current.i];

  if(textMode){
    optionsBox.innerHTML = `<input type="text" id="answerInput" class="answer-input" autocomplete="off" autocapitalize="off" placeholder="Verb eintippen…">
      <button class="opt check-btn" id="checkBtn">Prüfen</button>`;
    const input=document.getElementById("answerInput");
    const submit=()=>{
      const val=input.value.trim().toLowerCase();
      const correct = correctSet.some(w=>w.toLowerCase()===val);
      finishAnswer(correct, val || "(leer)");
    };
    document.getElementById("checkBtn").onclick=submit;
    input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); }});
    setTimeout(()=>input.focus(),0);
  } else {
    const distractorCount = OPTION_COUNT - correctSet.length;
    const opts=shuffle([...correctSet, ...sampleDistractors(correctSet, distractorCount, current)]);
    opts.forEach(word=>{
      const btn=document.createElement("button");
      btn.className="opt";
      btn.textContent=word;
      btn.onclick=()=>handleAnswer(word,btn);
      optionsBox.appendChild(btn);
    });
  }
}

function handleAnswer(word,btnEl){
  if(answered || !current) return;
  const correctSet = current.i2 ? [current.i, current.i2] : [current.i];
  const correct = correctSet.includes(word);
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(correctSet.includes(b.textContent)) b.classList.add("right");
    else if(b===btnEl) b.classList.add("chosen-wrong");
    else b.classList.add("dim");
  });
  finishAnswer(correct);
}

async function finishAnswer(correct){
  if(answered || !current) return;
  answered=true;
  const correctSet = current.i2 ? [current.i, current.i2] : [current.i];
  const blank=document.getElementById("blankSpan");
  if(blank){
    blank.textContent=correctSet.join(" / ");
    blank.classList.add("filled", correct?"correct":"wrong");
  }
  const input=document.getElementById("answerInput");
  const checkBtn=document.getElementById("checkBtn");
  if(input){
    input.disabled=true;
    input.classList.add(correct?"correct":"wrong");
  }
  if(checkBtn) checkBtn.disabled=true;

  const it=state.items[current.id];
  if(correct){
    it.stage=Math.min(3,it.stage+1);
    const bonus = state.dailyCount<20 ? 20 : 10;
    state.xp+=bonus;
    state.dailyCount++;
  } else {
    it.stage=Math.max(0,it.stage-1);
  }

  const phraseText = current.p || current.ph;
  document.getElementById("feedback").innerHTML=`<b>${phraseText}</b> — ${current.m}`;
  document.getElementById("nextBtn").disabled=false;

  renderStats();
  renderDossier(document.getElementById("searchBox").value);
  await saveState();
}

document.getElementById("nextBtn").onclick=renderCard;
document.getElementById("searchBox").oninput=(e)=>renderDossier(e.target.value);
document.getElementById("selAll").onclick=async ()=>{ state.disabled={}; renderDossier(document.getElementById("searchBox").value); renderStats(); await saveState(); };
document.getElementById("selNone").onclick=async ()=>{ ITEMS.forEach(it=>state.disabled[it.id]=true); renderDossier(document.getElementById("searchBox").value); renderStats(); await saveState(); };
document.getElementById("deselMarked").onclick=async ()=>{ ITEMS.forEach(it=>{ if(it.x) state.disabled[it.id]=true; }); renderDossier(document.getElementById("searchBox").value); renderStats(); await saveState(); };
document.getElementById("selMarked").onclick=async ()=>{ ITEMS.forEach(it=>{ if(it.x) delete state.disabled[it.id]; }); renderDossier(document.getElementById("searchBox").value); renderStats(); await saveState(); };
document.getElementById("modeAll").onclick=async ()=>{ state.filterMode="all"; renderModeButtons(); renderStats(); await saveState(); renderCard(); };
document.getElementById("modeMarked").onclick=async ()=>{ state.filterMode="marked"; renderModeButtons(); renderStats(); await saveState(); renderCard(); };
document.getElementById("resetBtn").onclick=async ()=>{
  if(!confirm("Fortschritt wirklich zurücksetzen? (Auswahl bleibt erhalten)")) return;
  const keepDisabled=state.disabled, keepFilter=state.filterMode;
  state=defaultState();
  state.disabled=keepDisabled; state.filterMode=keepFilter;
  updateStreak();
  await saveState();
  renderStats(); renderModeButtons(); renderDossier(); renderCard();
};

(async function init(){
  state=await loadState();
  updateStreak();
  await saveState();
  renderStats();
  renderModeButtons();
  renderDossier();
  renderCard();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
